<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardSage – Smart Card Picks for Flights</title>
    <meta name="description" content="Compare credit card, debit card and no-card offers across MakeMyTrip, Cleartrip and more. Find which card saves the most on your flight booking.">
    <meta name="author" content="CardSage" />
    <meta name="theme-color" content="#E4A827" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cardwiseoffer.com/">

    <!-- Structured data: WebSite schema for search engines -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "CardwiseOffer",
  "url": "https://cardwiseoffer.com",
  "description": "Compare credit card offers across MakeMyTrip, Cleartrip, Ixigo and more. Find which card saves the most on your flight booking.",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://cardwiseoffer.com/?from={from}&to={to}",
    "query-input": "required name=from"
  }
}
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CardSage – Smart Card Picks for Flights">
    <meta property="og:description" content="Compare credit card, debit card and no-card offers across MakeMyTrip, Cleartrip and more. Find which card saves the most on your flight booking.">
    <meta property="og:image" content="/og-image.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CardSage" />
    <meta name="twitter:title" content="CardSage – Smart Card Picks for Flights">
    <meta name="twitter:description" content="Compare credit card, debit card and no-card offers across MakeMyTrip, Cleartrip and more. Find which card saves the most on your flight booking.">
    <meta name="twitter:image" content="/og-image.png">

    <!-- Content Security Policy.
         frame-ancestors must be enforced via the X-Frame-Options response header
         (set by SecurityHeadersMiddleware in the backend) — browsers ignore
         frame-ancestors inside a <meta> CSP tag. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8000 http://localhost:8001 https://*.railway.app; frame-ancestors 'none'">

    <!-- Theme init — runs synchronously before React mounts to prevent FOUC.
         Reads saved preference from localStorage; falls back to OS preference.
         Sets .light / .dark class on <html> so CSS tokens resolve correctly. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cwo-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light' || (!saved && !prefersDark)) {
            document.documentElement.classList.add('light');
          } else if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* storage blocked in private mode — OS preference via CSS @media covers it */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
