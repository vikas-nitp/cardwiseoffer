name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Generated data and the API contract come from the backend repo (source of truth).
      # Needs a read-only token for the private backend repo stored as BACKEND_REPO_TOKEN.
      # Use the backend branch with the same name when it exists, otherwise main.
      - name: Pick backend ref
        id: backend_ref
        env:
          REPO: vikas-nitp/cwo_backend
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          set +e
          git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote --exit-code --heads "https://github.com/$REPO.git" "refs/heads/$BRANCH" >/dev/null
          code=$?
          set -e
          case "$code" in
            0) ref="$BRANCH" ;;
            2) ref=main; echo "::notice::No '$BRANCH' branch in $REPO; using main for the cross-repo check" ;;
            *) echo "::error::Could not query $REPO (git exit $code) - check BACKEND_REPO_TOKEN"; exit 1 ;;
          esac
          echo "Using $REPO@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: vikas-nitp/cwo_backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          ref: ${{ steps.backend_ref.outputs.ref }}
          path: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build backend data bundle
        run: |
          pip install -r backend/requirements.txt
          python backend/scripts/build_data_bundle.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync backend data + contract
        run: npm run data:build
        env:
          CWO_BACKEND_DIR: ${{ github.workspace }}/backend

      - name: Contract and generated API types are in sync with backend
        run: |
          npm run check:api-types
          test -z "$(git status --porcelain -- contracts src/types)" || { git status --short -- contracts src/types; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
